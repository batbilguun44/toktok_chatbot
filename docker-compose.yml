# Local / staging stack. Production: managed Postgres (with pgvector) and Redis.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: toktok
      POSTGRES_PASSWORD: toktok
      POSTGRES_DB: toktok_chatbot
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toktok"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://toktok:toktok@postgres:5432/toktok_chatbot
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
