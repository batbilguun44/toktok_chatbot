[project]
name = "toktok-chatbot"
version = "0.1.0"
description = "TokTok AI support chatbot (Driver / Client / Customer)"
requires-python = ">=3.11"
dependencies = [
    "anthropic==1.12.1",
    "langgraph==1.2.14",
    "langfuse==4.17.0",
    "fastapi>=0.140",
    "uvicorn[standard]>=0.50",
    "pydantic>=2.10",
    "pydantic-settings>=2.10",
    "redis>=5.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.5",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
