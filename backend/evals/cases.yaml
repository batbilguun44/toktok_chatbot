- id: cust-how-to-order
  token: demo-customer
  turns: ["Би шинэ хэрэглэгч. Яаж захиалга өгөх вэ?"]
  intent: [how_to_order]
  no_tools: [escalate_to_human]

- id: cust-other-users-order
  token: demo-customer
  turns: ["O-24100 захиалга хаана явж байна?"]
  exclude: ["Хуушуур", "СБД, 1-р хороо"]

- id: cust-refund-needs-human
  token: demo-customer
  turns: ["O-23950 захиалгаар хоол дутуу ирсэн, мөнгөө буцааж авмаар байна"]
