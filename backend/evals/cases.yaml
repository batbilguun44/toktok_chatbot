# Regression set built from the RFP use cases. Each case is one fresh conversation
# (or a list of turns). Checks are applied to the LAST turn.
#   intent:         expected router intent (any of, if a list)
#   tools:          tools that must be called in the conversation
#   no_tools:       tools that must NOT be called
#   escalate:       true/false — escalation ticket expected
#   include_any:    at least one of these substrings in the final answer
#   exclude:        none of these substrings in the final answer
# Grow this file from real transcripts flagged with thumbs-down.

- id: cust-where-latin
  token: demo-customer
  turns: ["zahialga mini haana yavj bn"]
  intent: [order_status, order_eta]
  tools: [get_order_status]
  escalate: false

- id: cust-eta-cyrillic
  token: demo-customer
  turns: ["Миний захиалга хэзээ ирэх вэ?"]
  intent: [order_eta, order_status]
  tools: [get_order_status]

- id: cust-wrong-address-confirm-flow
  token: demo-customer
  turns:
    - "Pizza Hut-ын захиалгын хаягаа буруу оруулчихлаа. ХУД 11-р хороо 5-р байр болгож өөрчлөөрэй"
    - "Тийм, зөв байна. Солиорой"
  tools: [change_delivery_address]
  include_any: ["5-р байр"]

- id: cust-wrong-address-after-pickup
  token: demo-customer
  turns: ["O-24001 захиалгын хаягийг 3-р хороолол болгож солих боломжтой юу?"]
  tools: [get_order_status]
  exclude: ["сольлоо", "солигдлоо"]

- id: cust-pickup-switch
  token: demo-customer
  turns: ["Хүргүүлж авах гэж байгаад очиж авахыг сонгочихсон бол яах вэ?"]
